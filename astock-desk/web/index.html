<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股 AI 交易委员会 · 盯盘 · 边学边练</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8F%9B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<style>
  :root{
    --bg:#0b0e14; --panel:#141924; --panel2:#1b2230; --line:#232c3d;
    --txt:#e6ebf3; --sub:#8b97ab; --acc:#3b82f6; --acc2:#22d3ee;
    --up:#ef4444; --down:#22c55e; --warn:#f59e0b; --gold:#eab308;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--acc2)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  header h1{font-size:19px;font-weight:700;letter-spacing:.5px}
  .badge{font-size:11px;color:var(--sub);border:1px solid var(--line);padding:2px 8px;border-radius:20px}
  .ticker{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto;font-size:12px;color:var(--sub)}
  .ticker b{font-weight:600}
  .disc{background:#2a1e10;border:1px solid #4a3616;color:#f0c674;font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:14px}
  .searchbar{display:flex;gap:8px;margin-bottom:8px;position:relative}
  input,select,button{font-family:inherit;font-size:14px}
  input[type=text]{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:10px;outline:none}
  input[type=text]:focus{border-color:var(--acc)}
  button{cursor:pointer;border:none;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--acc);color:#fff;transition:.15s}
  button:hover{filter:brightness(1.12)}
  button.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .quick span{font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--line);padding:5px 11px;border-radius:20px;cursor:pointer}
  .quick span:hover{border-color:var(--acc);color:var(--txt)}
  #suggest{position:absolute;top:48px;left:0;right:120px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;z-index:20;overflow:hidden;display:none}
  #suggest div{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
  #suggest div:hover{background:var(--panel)}
  .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .panel h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:12px;letter-spacing:.5px}
  .qhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .qname{font-size:20px;font-weight:700}
  .qcode{color:var(--sub);font-size:13px}
  .qprice{font-size:30px;font-weight:800;margin:6px 0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .stat{background:var(--panel2);border-radius:9px;padding:9px 11px}
  .stat .k{font-size:11px;color:var(--sub)}
  .stat .v{font-size:15px;font-weight:700;margin-top:2px}
  canvas{width:100%;display:block;border-radius:8px}
  .run{margin:16px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .run button{padding:13px 26px;font-size:15px}
  .steps{display:flex;flex-direction:column;gap:7px;margin:8px 0 4px}
  .step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);opacity:.5;transition:.3s}
  .step.active{opacity:1;color:var(--txt)}
  .step.done{opacity:1;color:var(--down)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
  .step.active .dot{background:var(--acc);box-shadow:0 0 0 4px rgba(59,130,246,.2)}
  .step.done .dot{background:var(--down)}
  .agents{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  @media(max-width:820px){.agents{grid-template-columns:1fr}}
  .agent{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;border-top:3px solid var(--line)}
  .agent .role{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .agent .emoji{font-size:16px}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:auto}
  .pill.看多{background:rgba(239,68,68,.15);color:var(--up)}
  .pill.看空{background:rgba(34,197,94,.15);color:var(--down)}
  .pill.中性{background:rgba(139,151,171,.15);color:var(--sub)}
  .score{font-size:12px;color:var(--sub);margin-bottom:8px}
  .agent .line{font-size:13px;margin:5px 0;color:var(--txt)}
  .agent .label{color:var(--sub);font-size:12px}
  ul.mini{list-style:none;margin:6px 0}
  ul.mini li{font-size:12.5px;padding-left:14px;position:relative;color:#c7d0de;margin:3px 0}
  ul.mini li:before{content:"·";position:absolute;left:3px;color:var(--acc)}
  ul.mini li.risk:before{content:"!";color:var(--warn)}
  .decision{margin-top:14px;background:linear-gradient(180deg,#151d2c,#121722);border:1px solid #26324a;border-radius:16px;padding:18px}
  .decision .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .action{font-size:24px;font-weight:900;padding:6px 18px;border-radius:12px}
  .a-买入,.a-加仓{background:rgba(239,68,68,.15);color:var(--up)}
  .a-卖出,.a-减仓{background:rgba(34,197,94,.15);color:var(--down)}
  .a-观望{background:rgba(139,151,171,.15);color:var(--sub)}
  .conf{display:flex;flex-direction:column;gap:4px;min-width:150px}
  .bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
  .dgrid .stat .v{font-size:14px}
  .thesis{margin-top:12px;font-size:13.5px;color:#d5deec;background:var(--panel2);padding:11px 13px;border-radius:10px;border-left:3px solid var(--acc)}
  .risk-box{margin-top:12px;background:#1e1710;border:1px solid #3d2f18;border-radius:12px;padding:14px}
  .risk-box .role{color:var(--gold)}
  .terms{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
  .chip{font-size:12px;background:var(--panel2);border:1px solid var(--line);padding:5px 12px;border-radius:20px;cursor:pointer;color:#cdd6e4}
  .chip:hover{border-color:var(--acc2);color:#fff}
  .chip:before{content:"📖 ";}
  .tabs{display:flex;gap:6px;margin:22px 0 12px}
  .tab{font-size:13px;padding:8px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--line);cursor:pointer;color:var(--sub)}
  .tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .bt-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
  .verdict{font-size:13px;color:#d5dec;background:var(--panel2);padding:10px 13px;border-radius:9px;margin-top:8px;color:#d5deec}
  .modal{position:fixed;inset:0;background:rgba(4,7,12,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
  .modal.show{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;padding:24px;max-height:86vh;overflow:auto}
  .card h2{font-size:20px;margin-bottom:4px}
  .card .ol{font-size:14px;color:var(--acc2);margin-bottom:14px}
  .card .sec{margin:12px 0}
  .card .sec .t{font-size:12px;color:var(--sub);margin-bottom:3px}
  .card .sec .c{font-size:14px;line-height:1.75;color:#dde5f1}
  .card .pit{background:#2a1e10;border:1px solid #4a3616;color:#f0c674;padding:10px 13px;border-radius:9px;font-size:13px}
  .x{float:right;cursor:pointer;color:var(--sub);font-size:22px;line-height:1}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .muted{color:var(--sub);font-size:12px}
  .empty{text-align:center;color:var(--sub);padding:30px;font-size:13px}
  /* 悬停讲解 */
  .tip{border-bottom:1px dotted var(--sub);cursor:help}
  .stat .k.tip{display:inline-block}
  #tooltip{position:fixed;z-index:100;max-width:280px;background:#0f1622;border:1px solid var(--acc);
    color:#e6ebf3;font-size:12.5px;line-height:1.6;padding:9px 12px;border-radius:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.55);pointer-events:none;opacity:0;transition:opacity .12s;display:none}
  #tooltip b{color:var(--acc2)}
  #tooltip .more{color:var(--sub);font-size:11px;margin-top:4px;display:block}
  .datmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:8px 0 2px;align-items:center}
  .sess{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .sess.live{background:rgba(239,68,68,.16);color:#ff6b6b}
  .sess.rest{background:rgba(139,151,171,.16);color:var(--sub)}
  .stale-banner{background:#3a1414;border:1px solid #6b2020;color:#ff9a9a;font-size:13px;
    padding:10px 13px;border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏛️ A股 AI 交易委员会</h1>
    <span class="badge">多智能体 · 盯盘 · 边学边练</span>
    <div class="ticker" id="ticker"></div>
  </header>
  <div class="disc">⚠️ 教育与研究用途，<b>不构成投资建议</b>。多智能体研判仅供学习决策框架；A股实盘有滑点、T+1、政策与情绪风险，请独立决策、严控仓位。</div>

  <div class="searchbar">
    <input type="text" id="q" placeholder="输入股票代码或名称，如 600519 / 贵州茅台 / 宁德时代" autocomplete="off">
    <button onclick="loadQuote()">查询</button>
    <div id="suggest"></div>
  </div>
  <div class="quick" id="quick"></div>

  <div class="grid">
    <div class="panel" id="quotePanel"><div class="empty">🔍 搜索一只股票开始</div></div>
    <div class="panel">
      <h3>日K走势（近90日）</h3>
      <canvas id="kchart" height="220"></canvas>
      <div class="muted" id="kinfo" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="run">
    <button id="runBtn" onclick="runCommittee()" disabled>⚖️ 召开投资委员会</button>
    <div class="steps" id="steps" style="display:none"></div>
  </div>

  <div id="committee"></div>

  <div id="btSection" style="display:none">
    <div class="tabs">
      <div class="tab on" data-s="ma" onclick="runBT('ma',this)">均线金叉</div>
      <div class="tab" data-s="macd" onclick="runBT('macd',this)">MACD</div>
      <div class="tab" data-s="rsi" onclick="runBT('rsi',this)">RSI超买超卖</div>
    </div>
    <div class="panel" id="btPanel"><div class="empty">选择一个策略做历史回测，看它真实的赢面与回撤</div></div>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)close_()">
  <div class="card" id="modalCard"></div>
</div>
<div id="tooltip"></div>

<script>
const $ = s => document.querySelector(s);
let CUR = null;

/* ---------- 术语速查（悬停即时讲解） ---------- */
const TIPS = {
  "今开":"今日开盘价，即当天第一笔成交的价格。","最高":"当天成交过的最高价。","最低":"当天成交过的最低价。",
  "换手率":"当天成交股数占流通股的比例。越高说明交易越活跃、筹码换手越频繁。",
  "量比":"当前每分钟成交量 ÷ 过去5日每分钟平均成交量。>1表示放量、<1表示缩量。",
  "振幅":"当天最高价与最低价之差占昨收的比例，衡量当天波动剧烈程度。",
  "市盈率":"股价 ÷ 每股收益。相当于按当前盈利，多少年能靠利润回本。越低越'便宜'但要看行业和成长性。",
  "市盈率TTM":"用最近12个月滚动净利润算的市盈率，比按年报算更及时。",
  "PE":"市盈率，股价是每股盈利的多少倍。18倍≈理论18年靠利润回本。",
  "市净率":"股价 ÷ 每股净资产。衡量股价相对公司'家底'贵不贵，银行地产常用。",
  "PB":"市净率，股价相对每股净资产的倍数。<1叫'破净'。",
  "总市值":"公司总价值＝股价×总股本。反映公司体量大小。",
  "流通市值":"可自由买卖部分的市值＝股价×流通股本。",
  "ROE":"净资产收益率＝净利润÷净资产。巴菲特最看重的指标，衡量公司用自有资本赚钱的效率，长期>15%算优秀。",
  "毛利率":"（营收-成本）÷营收。反映产品赚不赚钱、有没有护城河，茅台高达90%。",
  "净利率":"净利润÷营收。100块营收最后净赚多少，反映综合盈利能力。",
  "资产负债率":"总负债÷总资产。衡量公司欠债多不多、财务安不安全。",
  "营收同比":"本期营业收入相比去年同期的增长率，看成长性。",
  "净利同比":"本期净利润相比去年同期的增长率。",
  "趋势":"由5/20/60日均线排列判断：多头排列(上涨趋势)/空头排列(下跌趋势)/震荡。",
  "均线":"过去N天收盘价的平均线(MA5/20/60)。价格在均线上方偏强、下方偏弱。",
  "MACD":"由两条均线差值构成的趋势指标。DIF上穿DEA叫'金叉'(偏多)、下穿叫'死叉'(偏空)。",
  "MACD金叉":"MACD快线上穿慢线，常被视为买入信号(需结合位置)。",
  "MACD死叉":"MACD快线下穿慢线，常被视为卖出/走弱信号。",
  "RSI":"相对强弱指标(0-100)。>70超买(可能过热)、<30超卖(可能超跌)。",
  "RSI14":"用14天数据算的RSI，最常用。",
  "KDJ":"随机指标，衡量收盘价在近期高低区间的相对位置，用于抓超买超卖与拐点。",
  "布林带":"以20日均线为中轨、上下加减2倍标准差的通道。价格触上轨偏强、触下轨偏弱。",
  "波动率":"价格涨跌的剧烈程度(年化)。越高风险越大、止损要越宽。",
  "主力资金":"大单/超大单资金的净流入流出，通常代表机构、游资等'大户'动向。",
  "主力资金流向":"主力资金是净流入(买)还是净流出(卖)，反映大户态度。",
  "板块资金流向":"整个行业板块的资金净流入流出，看风口在不在这个方向。",
  "北向资金":"通过沪港通/深港通从香港流入A股的外资，俗称'聪明钱'，其动向常被参考。",
  "超大单":"单笔金额极大的成交(通常>百万)，多为机构行为。",
  "仓位管理":"控制单只股票/总仓位占资金的比例。确定性越低仓位越小，是风控的核心。",
  "最大回撤":"从最高点跌到最低点的最大亏损幅度。回撤50%需反弹100%才回本，衡量策略痛苦程度。",
  "止损纪律":"预设一个亏损线，跌破无条件卖出，保护本金不被深套。",
  "止损价":"触及即卖出的价格，用于把单笔亏损控制在可承受范围。",
  "止盈":"达到目标收益主动卖出，落袋为安。",
  "目标价":"预期股价能到达的价位，用于评估上涨空间与盈亏比。",
  "买入区间":"建议分批买入的价格范围，而非一口价追高。",
  "持有周期":"预计持股的时间跨度(如波段2-4周)。",
  "置信度":"AI对本次判断把握的高低。低于40%通常建议观望而非下注。",
  "夏普比率":"每承担一份波动风险换来的超额收益。>1尚可、>1.5优秀，衡量'性价比'。",
  "年化":"把一段时间的收益折算成一年的收益率，便于横向比较。",
  "总收益":"整个回测区间的累计收益率。","胜率":"盈利交易次数占总交易次数的比例。",
  "趋势确认":"用多周期或多指标共振来确认趋势成立，减少假信号。",
  "T+1":"A股当天买入的股票要到下一个交易日才能卖出的制度。",
  "滑点":"实际成交价与预期价的偏差，尤其在急涨急跌或流动性差时明显。",
  "综合评分":"三位分析师打分的平均，正=偏多、负=偏空，仅供参考。",
};
function tipText(k){ return TIPS[k] || null; }

function fmtNum(v,d=2){ if(v==null||v==='')return '—'; const n=+v; return isNaN(n)?v:n.toFixed(d); }
function upcls(v){ return (+v>0)?'--up': (+v<0)?'--down':''; }
function colorPct(v){ if(v==null)return 'var(--sub)'; return +v>0?'var(--up)':+v<0?'var(--down)':'var(--sub)'; }

async function jget(url){ const r = await fetch(url); return r.json(); }

async function loadTicker(){
  try{
    const d = await jget('api/index');
    $('#ticker').innerHTML = (d.index||[]).map(i=>
      `<span>${i.name} <b style="color:${colorPct(i.pct)}">${fmtNum(i.price)} ${i.pct>0?'+':''}${fmtNum(i.pct)}%</b></span>`).join('');
  }catch(e){}
}
const QUICK = [['600519','贵州茅台'],['300750','宁德时代'],['601318','中国平安'],['000858','五粮液'],['600036','招商银行'],['002594','比亚迪'],['688981','中芯国际'],['600900','长江电力']];
$('#quick').innerHTML = QUICK.map(([c,n])=>`<span onclick="pick('${c}','${n}')">${n}</span>`).join('');
function pick(c,n){ $('#q').value = c; loadQuote(); }

let sugTimer;
$('#q').addEventListener('input', e=>{
  clearTimeout(sugTimer); const v=e.target.value.trim();
  if(!v){ $('#suggest').style.display='none'; return; }
  sugTimer = setTimeout(async ()=>{
    const d = await jget('api/search?q='+encodeURIComponent(v));
    const box = $('#suggest');
    if(!(d.results||[]).length){ box.style.display='none'; return; }
    box.innerHTML = d.results.map(r=>`<div onclick="pick('${r.code}','${r.name}')"><b>${r.name}</b> <span class="muted">${r.code} · ${r.type||''}</span></div>`).join('');
    box.style.display='block';
  }, 260);
});
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'){$('#suggest').style.display='none';loadQuote();}});
document.addEventListener('click',e=>{ if(!e.target.closest('.searchbar'))$('#suggest').style.display='none';});

async function loadQuote(){
  const code = $('#q').value.trim().replace(/[^0-9]/g,'').slice(0,6) || $('#q').value.trim();
  if(!code) return;
  $('#quotePanel').innerHTML = '<div class="empty"><span class="spin"></span> 加载行情…</div>';
  const d = await jget('api/quote?code='+encodeURIComponent(code));
  if(d.error||!d.quote){ $('#quotePanel').innerHTML='<div class="empty">未找到该标的</div>'; return; }
  CUR = {code, quote:d.quote, ind:d.indicators, status:d.data_status};
  renderQuote(d);
  $('#runBtn').disabled = !!(d.data_status && d.data_status.stale);
  $('#runBtn').textContent = `⚖️ 为「${d.quote.name}」召开投资委员会`;
  drawK(d.kline||[]);
  $('#committee').innerHTML=''; $('#steps').style.display='none';
  $('#btSection').style.display='block';
  $('#btPanel').innerHTML='<div class="empty">选择一个策略做历史回测，看它真实的赢面与回撤</div>';
  scheduleRefresh();
}

const SESS = {pre:'未开盘',morning:'早盘交易中',noon:'午间休市',afternoon:'午盘交易中',closed:'已收盘',weekend:'休市(周末)'};
function renderQuote(d){
  const q=d.quote, ind=d.indicators||{}, s=d.data_status||{};
  const live = (s.session==='morning'||s.session==='afternoon');
  const banner = s.stale ? `<div class="stale-banner">⚠️ ${s.reason||'数据可能已过期'}。请勿据此判断，换一只正常交易的股票。</div>` : '';
  $('#quotePanel').innerHTML = banner + `
    <div class="qhead"><span class="qname">${q.name}</span><span class="qcode">${q.code}</span></div>
    <div class="datmeta">
      <span class="sess ${live?'live':'rest'}">${live?'🔴 ':'● '}${SESS[s.session]||'—'}</span>
      <span data-tip="行情时间" class="tip">🕐 行情 ${q.time_str||s.as_of||'—'}</span>
      <span>K线截至 ${s.last_bar||'—'}</span>
      <span class="muted">刷新于 ${d.server_time||''}</span>
    </div>
    <div class="qprice" style="color:${colorPct(q.pct)}">${fmtNum(q.price)} <span style="font-size:16px">${q.change>0?'+':''}${fmtNum(q.change)} (${q.pct>0?'+':''}${fmtNum(q.pct)}%)</span></div>
    <div class="stats">
      ${stat('今开',fmtNum(q.open))}${stat('最高',fmtNum(q.high))}${stat('最低',fmtNum(q.low))}
      ${stat('换手率',fmtNum(q.turnover)+'%')}${stat('量比',fmtNum(q.vol_ratio))}${stat('振幅',fmtNum(q.amplitude)+'%')}
      ${stat('市盈率TTM',fmtNum(q.pe_ttm))}${stat('市净率',fmtNum(q.pb))}${stat('总市值',fmtNum(q.total_mv_yi,0)+'亿')}
    </div>
    <div class="stats" style="margin-top:10px">
      ${stat('趋势',ind.trend||'—')}${stat('MACD',ind.macd_signal||'—','MACD')}${stat('RSI14',fmtNum(ind.rsi14,1))}
    </div>`;
}
TIPS["行情时间"]="行情数据的最新更新时刻（北京时间）。盘中约每几秒更新一次，收盘后停在收盘时刻。";

let refreshTimer=null;
function scheduleRefresh(){
  clearInterval(refreshTimer);
  refreshTimer = setInterval(async ()=>{
    if(!CUR) return;
    const s=CUR.status||{};
    if(s.session!=='morning' && s.session!=='afternoon') return; // 非交易时段不刷
    const d = await jget('api/quote?code='+encodeURIComponent(CUR.code));
    if(d && d.quote && !(d.data_status&&d.data_status.stale)){ CUR.status=d.data_status; renderQuote(d); }
  }, 15000);
}
function stat(k,v,tipKey){
  const key = tipKey||k;
  const has = tipText(key);
  const kcls = has? 'k tip' : 'k';
  const attr = has? ` data-tip="${key}"` : '';
  return `<div class="stat"><div class="${kcls}"${attr}>${k}</div><div class="v">${v}</div></div>`;
}
/* 悬停 tooltip：事件委托 + 浮层跟随 */
const TT = $('#tooltip');
document.addEventListener('mouseover', e=>{
  const el = e.target.closest('[data-tip]'); if(!el) return;
  const key = el.getAttribute('data-tip'); const txt = tipText(key);
  if(!txt) return;
  const clickable = el.classList.contains('chip') || el.dataset.click==='1';
  TT.innerHTML = `<b>${key}</b>：${txt}` + (clickable? `<span class="more">点击查看AI导师详解 →</span>`:'');
  TT.style.display='block'; TT.style.opacity='1';
  positionTip(el);
});
document.addEventListener('mousemove', e=>{ if(TT.style.display==='block') positionTT(e); });
document.addEventListener('mouseout', e=>{ if(e.target.closest('[data-tip]')){ TT.style.opacity='0'; TT.style.display='none'; }});
let lastEvt=null;
function positionTT(e){ lastEvt=e; const x=e.clientX, y=e.clientY;
  const w=TT.offsetWidth, h=TT.offsetHeight;
  let left=x+14, top=y+16;
  if(left+w>window.innerWidth-8) left=x-w-14;
  if(top+h>window.innerHeight-8) top=y-h-16;
  TT.style.left=Math.max(8,left)+'px'; TT.style.top=Math.max(8,top)+'px';
}
function positionTip(el){ const r=el.getBoundingClientRect();
  const w=TT.offsetWidth||220, h=TT.offsetHeight||60;
  let left=r.left, top=r.bottom+8;
  if(left+w>window.innerWidth-8) left=window.innerWidth-w-8;
  if(top+h>window.innerHeight-8) top=r.top-h-8;
  TT.style.left=Math.max(8,left)+'px'; TT.style.top=Math.max(8,top)+'px';
}

function drawK(ks){
  const cv=$('#kchart'); const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=220; cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  if(!ks.length){ $('#kinfo').textContent=''; return; }
  const hi=Math.max(...ks.map(k=>k.high)), lo=Math.min(...ks.map(k=>k.low));
  const pad=8, cw=(W-2*pad)/ks.length, x=i=>pad+i*cw+cw/2, y=v=>pad+(H-2*pad)*(1-(v-lo)/(hi-lo||1));
  ks.forEach((k,i)=>{
    const up=k.close>=k.open, col=up?'#ef4444':'#22c55e';
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x(i),y(k.high)); ctx.lineTo(x(i),y(k.low)); ctx.stroke();
    const bw=Math.max(cw*0.6,1.5), yo=y(k.open), yc=y(k.close);
    ctx.fillRect(x(i)-bw/2, Math.min(yo,yc), bw, Math.max(Math.abs(yc-yo),1));
  });
  $('#kinfo').textContent = `区间 ${ks[0].date} ~ ${ks[ks.length-1].date}　最高 ${hi.toFixed(2)}　最低 ${lo.toFixed(2)}`;
}

function runCommittee(){
  if(!CUR) return;
  $('#runBtn').disabled=true;
  const steps=[['gather','抓取行情/财务/资金/新闻'],['fundamental','基本面分析师'],['technical','技术面分析师'],['sentiment','情绪资金面分析师'],['trader','首席交易员决策'],['risk','风控官审查']];
  const sEl=$('#steps'); sEl.style.display='flex';
  sEl.innerHTML=steps.map(([k,l])=>`<div class="step" id="st-${k}"><span class="dot"></span>${l}</div>`).join('');
  $('#committee').innerHTML='';
  const es=new EventSource('api/committee?code='+encodeURIComponent(CUR.code));
  let order=steps.map(s=>s[0]), lastIdx=-1;
  es.addEventListener('progress',ev=>{
    const d=JSON.parse(ev.data); const idx=order.indexOf(d.step);
    order.forEach((k,i)=>{ const el=$('#st-'+k); if(!el)return;
      el.className='step'+(i<idx?' done':i===idx?' active':''); });
    lastIdx=idx;
  });
  es.addEventListener('result',ev=>{
    order.forEach(k=>{const el=$('#st-'+k); if(el)el.className='step done';});
    const d=JSON.parse(ev.data);
    es.close(); $('#runBtn').disabled=false;
    if(d.error){ $('#committee').innerHTML=`<div class="panel empty">出错：${d.error}</div>`; return; }
    renderCommittee(d);
  });
  es.onerror=()=>{ es.close(); $('#runBtn').disabled=false; };
}

const ROLE=[['fundamental','📊','基本面分析师'],['technical','📈','技术面分析师'],['sentiment','🔥','情绪资金面']];
function renderCommittee(d){
  const A=d.analysts;
  const cards = ROLE.map(([k,e,name])=>{
    const a=A[k]||{}; const st=a.stance||'中性';
    const hi=(a.highlights||[]).map(x=>`<li>${x}</li>`).join('');
    const rk=(a.risks||[]).map(x=>`<li class="risk">${x}</li>`).join('');
    const extra = a.valuation||a.pattern||a.capital_flow||'';
    const extra2 = a.entry_zone?`买点 ${a.entry_zone}`:(a.market_mood||a.news_read||'');
    return `<div class="agent" style="border-top-color:${st==='看多'?'var(--up)':st==='看空'?'var(--down)':'var(--line)'}">
      <div class="role"><span class="emoji">${e}</span>${name}<span class="pill ${st}">${st}</span></div>
      <div class="score">评分 <b style="color:${st==='看多'?'var(--up)':st==='看空'?'var(--down)':'var(--sub)'}">${a.score??'—'}</b> / 100</div>
      ${extra?`<div class="line"><span class="label"></span>${extra}</div>`:''}
      ${extra2?`<div class="line muted">${extra2}</div>`:''}
      ${hi?`<ul class="mini">${hi}</ul>`:''}
      ${rk?`<ul class="mini">${rk}</ul>`:''}
      <div class="line muted" style="margin-top:6px">${a.reasoning||''}</div>
    </div>`;
  }).join('');

  const t=d.trader||{}, r=d.risk||{};
  const conf=+t.confidence||0;
  const decision = `<div class="decision">
    <div class="top">
      <span class="action a-${t.action||'观望'}">${t.action||'观望'}</span>
      <div class="conf"><span class="muted tip" data-tip="置信度">置信度 ${conf}%</span><div class="bar"><i style="width:${conf}%"></i></div></div>
      <div class="muted tip" data-tip="综合评分" style="margin-left:auto">综合评分 ${d.composite_score}</div>
    </div>
    <div class="dgrid">
      ${stat('买入区间',t.buy_zone||'—')}${stat('目标价',t.target_price||'—')}${stat('止损价',t.stop_loss||'—')}${stat('持有周期',t.horizon||'—')}
    </div>
    ${t.consensus?`<div class="line" style="margin-top:10px"><span class="label">三方共识：</span>${t.consensus}</div>`:''}
    ${t.divergence?`<div class="line"><span class="label">分歧取舍：</span>${t.divergence}</div>`:''}
    ${t.thesis?`<div class="thesis">💡 ${t.thesis}</div>`:''}
    <div class="risk-box">
      <div class="role"><span class="emoji">🛡️</span>风控官 · 裁决：<b>${r.verdict||'—'}</b>　建议单票仓位上限 <b>${r.max_position_pct??'—'}%</b></div>
      ${(r.risk_flags||[]).length?`<ul class="mini">${r.risk_flags.map(x=>`<li class="risk">${x}</li>`).join('')}</ul>`:''}
      ${(r.discipline||[]).length?`<div class="label" style="margin-top:6px">硬性纪律：</div><ul class="mini">${r.discipline.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
      ${r.adjusted_advice?`<div class="line" style="margin-top:6px">📌 ${r.adjusted_advice}</div>`:''}
    </div>
  </div>`;

  const terms = (d.terms||[]).length ? `<div class="panel" style="margin-top:14px">
     <h3>📚 悬停看速查 · 点击听AI导师详解（边看边学）</h3>
     <div class="terms">${d.terms.map(t=>{const tt=t.replace(/'/g,'');return `<span class="chip" data-tip="${tt}" data-click="1" onclick="explain('${tt}')">${t}</span>`;}).join('')}</div>
   </div>` : '';

  $('#committee').innerHTML = `<div class="agents">${cards}</div>${decision}${terms}
     <div class="muted" style="margin-top:12px">${d.disclaimer||''}</div>`;
}

async function explain(term){
  const ctx = CUR? `${CUR.quote.name} 现价${CUR.quote.price}`:'';
  $('#modal').classList.add('show');
  $('#modalCard').innerHTML = `<span class="x" onclick="close_()">×</span><div class="empty"><span class="spin"></span> AI导师讲解「${term}」…</div>`;
  const d = await jget('api/explain?term='+encodeURIComponent(term)+'&context='+encodeURIComponent(ctx));
  $('#modalCard').innerHTML = `<span class="x" onclick="close_()">×</span>
    <h2>${d.term||term}</h2>
    <div class="ol">${d.one_line||''}</div>
    <div class="sec"><div class="t">通俗讲解</div><div class="c">${d.detail||''}</div></div>
    <div class="sec"><div class="t">散户怎么用</div><div class="c">${d.how_to_use||''}</div></div>
    ${d.pitfall?`<div class="pit">⚠️ 新手易踩坑：${d.pitfall}</div>`:''}`;
}
function close_(){ $('#modal').classList.remove('show'); }

async function runBT(strategy, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on')); el.classList.add('on');
  if(!CUR) return;
  $('#btPanel').innerHTML='<div class="empty"><span class="spin"></span> 回测中…</div>';
  const d = await jget('api/backtest?code='+encodeURIComponent(CUR.code)+'&strategy='+strategy);
  if(d.error){ $('#btPanel').innerHTML=`<div class="empty">${d.error}</div>`; return; }
  const m=d.metrics, b=d.benchmark;
  $('#btPanel').innerHTML = `
    <h3>${d.strategy_name} · ${d.period} · ${d.bars}根K线</h3>
    <div class="bt-metrics">
      ${stat('总收益',(m.total_return_pct>0?'+':'')+m.total_return_pct+'%')}
      ${stat('年化',(m.cagr_pct>0?'+':'')+m.cagr_pct+'%')}
      ${stat('最大回撤',m.max_drawdown_pct+'%')}
      ${stat('夏普比率',m.sharpe)}
      ${stat('胜率',m.win_rate_pct!=null?m.win_rate_pct+'%':'—')}
      ${stat('交易次数',m.trades)}
    </div>
    <canvas id="eqchart" height="200"></canvas>
    <div class="verdict">📊 ${d.verdict}</div>
    <div class="verdict" style="background:transparent;padding:8px 0"><span class="muted">基准(买入持有)：总收益 ${b.total_return_pct}%　最大回撤 ${b.max_drawdown_pct}%　夏普 ${b.sharpe}</span></div>
    <div class="muted" style="margin-top:6px">${d.note}</div>`;
  drawEquity(d.curve);
}
function drawEquity(curve){
  const cv=$('#eqchart'); if(!cv||!curve.length)return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth,H=200;
  cv.width=W*dpr;cv.height=H*dpr; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  const all=curve.flatMap(p=>[p.strategy,p.buyhold]); const hi=Math.max(...all),lo=Math.min(...all);
  const pad=10, x=i=>pad+(W-2*pad)*i/(curve.length-1||1), y=v=>pad+(H-2*pad)*(1-(v-lo)/(hi-lo||1));
  ctx.strokeStyle='#334155';ctx.lineWidth=1; ctx.beginPath();ctx.moveTo(pad,y(1));ctx.lineTo(W-pad,y(1));ctx.stroke();
  function line(key,color,w){ ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();
    curve.forEach((p,i)=>{i?ctx.lineTo(x(i),y(p[key])):ctx.moveTo(x(i),y(p[key]));});ctx.stroke(); }
  line('buyhold','#6b7280',1.5); line('strategy','#3b82f6',2);
  ctx.fillStyle='#8b97ab';ctx.font='11px sans-serif';
  ctx.fillStyle='#3b82f6';ctx.fillText('■ 策略',pad,14); ctx.fillStyle='#6b7280';ctx.fillText('■ 买入持有',pad+56,14);
}

loadTicker(); setInterval(loadTicker, 30000);
